<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Smith - Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <img src="images/logo.svg" alt="Logo" class="logo">
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#website">Website</a>
        </nav>
    </header>

    <!-- Profile Card -->
    <main class="card">
        <h1>John Smith</h1>
        <img src="images/student.svg" alt="Student Photo" class="photo">

        <section id="about">
            <h2>About Me</h2>
            <p>Hello! My name is John Smith. I am a computer science student and I am learning HTML, CSS and JavaScript.
            </p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>C#</li>
            </ul>
        </section>

        <section id="website">
            <h2>My Website</h2>
            <a href="https://girisushant.com.np/" target="_blank" class="btn">Visit My Website</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 John Smith. All rights reserved.</p>
    </footer>

</body>

</html>
